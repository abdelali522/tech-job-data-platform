services:
  airflow-init:
    image: apache/airflow:2.10.4-python3.11
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_WEBSERVER_SECRET_KEY:-change-me-local}"
      AIRFLOW_ADMIN_USERNAME: "${AIRFLOW_ADMIN_USERNAME:-admin}"
      AIRFLOW_ADMIN_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD:-admin}"
      AIRFLOW_ADMIN_EMAIL: "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}"
      _PIP_ADDITIONAL_REQUIREMENTS: "requests==2.32.3 python-dotenv==1.2.2 kafka-python>=2.2,<3"
    command: >-
      bash -c "airflow db migrate &&
      airflow users create
      --username $$AIRFLOW_ADMIN_USERNAME
      --password $$AIRFLOW_ADMIN_PASSWORD
      --firstname Tech
      --lastname Jobs
      --role Admin
      --email $$AIRFLOW_ADMIN_EMAIL || true"
    volumes:
      - airflow_data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/project

  airflow-webserver:
    image: apache/airflow:2.10.4-python3.11
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_WEBSERVER_SECRET_KEY:-change-me-local}"
      _PIP_ADDITIONAL_REQUIREMENTS: "requests==2.32.3 python-dotenv==1.2.2 kafka-python>=2.2,<3"
    command: webserver
    volumes:
      - airflow_data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/project

  airflow-scheduler:
    image: apache/airflow:2.10.4-python3.11
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_WEBSERVER_SECRET_KEY:-change-me-local}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      _PIP_ADDITIONAL_REQUIREMENTS: "requests==2.32.3 python-dotenv==1.2.2 kafka-python>=2.2,<3"
    command: scheduler
    volumes:
      - airflow_data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/project

  kafka:
    image: bitnamilegacy/kafka:3.9.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - kafka_data:/bitnami/kafka

  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: "tech_jobs"
      POSTGRES_USER: "tech_jobs"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me-local}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./storage/gold/postgres_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tech_jobs -d tech_jobs"]
      interval: 10s
      timeout: 5s
      retries: 12

  spark-master:
    image: apache/spark:3.5.3-python3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8080:8080"

  spark-worker:
    image: apache/spark:3.5.3-python3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
    volumes:
      - .:/opt/project

  spark-streaming:
    image: apache/spark:3.5.3-python3
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
    command: >-
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --conf spark.jars.ivy=/tmp/.ivy2
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.postgresql:postgresql:42.7.4,org.apache.hadoop:hadoop-aws:3.3.4
      /opt/project/streaming/spark_streaming.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET}"
      S3_BRONZE_PATH: "${S3_BRONZE_PATH:-}"
      S3_SILVER_PATH: "${S3_SILVER_PATH:-}"
      S3_CHECKPOINT_PATH: "${S3_CHECKPOINT_PATH:-}"
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/tech_jobs
      POSTGRES_USER: tech_jobs
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me-local}"
    volumes:
      - .:/opt/project

volumes:
  airflow_data:
  kafka_data:
  postgres_data:
